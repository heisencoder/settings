#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    # gaps_in = 5
    # gaps_out = 20
    # Windows reach the very edge of the screen (gaps_out = 0, no border), so a
    # click on the edge goes straight into the window (Fitts' law).  Between
    # windows, gaps_in leaves an 8px separator (4px per window) that shows
    # misc:background_color.  Hyprland borders are the same width on all four
    # sides, so a thick border between windows would also cover the screen edge.
    gaps_in = 4
    gaps_out = 0

    # border_size = 2
    # The focused window is the one that isn't dimmed (see dim_inactive below).
    border_size = 0

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    # resize_on_border = false
    # Drag the gap between two windows to resize them.
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    # layout = dwindle
    # Master layout: main windows across the top, small windows in a row below.
    layout = master
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    # rounding = 10
    rounding = 0
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    # Dim unfocused windows, like `picom --inactive-dim 0.125` under i3.
    dim_inactive = true
    dim_strength = 0.125

    shadow {
        # enabled = true
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        # enabled = true
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    # Zippy: each SPEED is 30% of the default (SPEED is a duration, so 3x faster).
    # animation = global,        1,     10,    default
    animation = global,        1,     3,     default
    # animation = border,        1,     5.39,  easeOutQuint
    animation = border,        1,     1.62,  easeOutQuint
    # animation = windows,       1,     4.79,  easeOutQuint
    animation = windows,       1,     1.44,  easeOutQuint
    # animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsIn,     1,     1.23,  easeOutQuint, popin 87%
    # animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = windowsOut,    1,     0.45,  linear,       popin 87%
    # animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeIn,        1,     0.52,  almostLinear
    # animation = fadeOut,       1,     1.46,  almostLinear
    animation = fadeOut,       1,     0.44,  almostLinear
    # animation = fade,          1,     3.03,  quick
    animation = fade,          1,     0.91,  quick
    # animation = layers,        1,     3.81,  easeOutQuint
    animation = layers,        1,     1.14,  easeOutQuint
    # animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersIn,      1,     1.2,   easeOutQuint, fade
    # animation = layersOut,     1,     1.5,   linear,       fade
    animation = layersOut,     1,     0.45,  linear,       fade
    # animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersIn,  1,     0.54,  almostLinear
    # animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = fadeLayersOut, 1,     0.42,  almostLinear
    # animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspaces,    1,     0.58,  almostLinear, fade
    # animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesIn,  1,     0.36,  almostLinear, fade
    # animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = workspacesOut, 1,     0.58,  almostLinear, fade
    # animation = zoomFactor,    1,     7,     quick
    animation = zoomFactor,    1,     2.1,   quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    # (Removed in Hyprland 0.56, and this config uses the master layout anyway.)
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
# Main ("master") windows sit side by side across the top 70% of the screen.
# Everything else lines up along the bottom.  $mainMod+semicolon adds a second
# main window; $mainMod+v removes one.
master {
    # new_status = master
    new_status = slave
    orientation = top
    mfact = 0.70
}

# Tabbed groups (i3's tabbed layout): light tab bar, i3-blue active tab.
group {
    groupbar {
        font_family = monospace
        font_size = 14
        height = 22
        gradients = true
        col.active = rgb(5588ff)
        col.inactive = rgb(e8e8e8)
        text_color = rgb(ffffff)
        text_color_inactive = rgb(333333)
    }
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    # force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    # disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # Color of the separators between windows (and of an empty workspace):
    # the same dark blue as the waybar text.
    background_color = rgb(111188)

    # When one window is maximized ($mainMod+Ctrl+f, used on the laptop screen),
    # focusing another window maximizes that one instead.
    on_focus_under_fullscreen = 1
}

binds {
    # $mainMod+h/l walk through the tabs of a group before leaving it, like i3.
    movefocus_cycles_groupfirst = true
    # $mainMod+hjkl also cycles while a window is maximized.
    movefocus_cycles_fullscreen = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    # kb_options =
    # Caps Lock is another Escape (from ~/settings/Xmodmap).
    kb_options = caps:escape
    kb_rules =

    # Same as `xset r rate 300 30` in ~/settings/fix.
    repeat_delay = 300
    repeat_rate = 30

    # follow_mouse = 1
    # Like `focus_follows_mouse no` in i3: focus changes only on click.
    follow_mouse = 2

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    # Double mouse-wheel speed (replaces ~/settings/imwheelrc).
    scroll_factor = 2.0

    touchpad {
        natural_scroll = false
        # Don't double touchpad scrolling along with the mouse wheel.
        scroll_factor = 0.5
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
# bind = $mainMod, Q, exec, $terminal
# bind = $mainMod, C, killactive,
# bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
# bind = $mainMod, E, exec, $fileManager
# bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
# bind = $mainMod, up, movefocus, u
# bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
# Right hand only: workspaces 6-10.
# bind = $mainMod, 1, workspace, 1
# bind = $mainMod, 2, workspace, 2
# bind = $mainMod, 3, workspace, 3
# bind = $mainMod, 4, workspace, 4
# bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
# bind = $mainMod SHIFT, 1, movetoworkspace, 1
# bind = $mainMod SHIFT, 2, movetoworkspace, 2
# bind = $mainMod SHIFT, 3, movetoworkspace, 3
# bind = $mainMod SHIFT, 4, movetoworkspace, 4
# bind = $mainMod SHIFT, 5, movetoworkspace, 5
# bind = $mainMod SHIFT, 6, movetoworkspace, 6
# bind = $mainMod SHIFT, 7, movetoworkspace, 7
# bind = $mainMod SHIFT, 8, movetoworkspace, 8
# bind = $mainMod SHIFT, 9, movetoworkspace, 9
# bind = $mainMod SHIFT, 0, movetoworkspace, 10
# Use Ctrl instead of Shift.  Like i3, the window moves but focus stays here.
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

### Matt's bindings, ported from ~/settings/i3/config ###

# Start programs
bind = $mainMod CTRL, I, exec, $terminal
bind = $mainMod CTRL, U, exec, $browser
bind = $mainMod CTRL, O, exec, /snap/bin/code || /usr/bin/code
bind = $mainMod CTRL, Y, exec, ~/bin/sunsama || /usr/bin/google-chrome-stable --app=https://app.sunsama.com/group/heisencoder
bind = $mainMod CTRL, N, exec, $fileManager

# Jump to a particular window type
bind = $mainMod, U, focuswindow, class:^([Gg]oogle-chrome)$
bind = $mainMod, I, focuswindow, class:^(com\.mitchellh\.ghostty|kitty|Alacritty|org\.gnome\.Ptyxis)$
bind = $mainMod, O, focuswindow, class:^([Cc]ode|[Cc]ursor)$
bind = $mainMod, P, focuswindow, title:^Zoom Meeting$
bind = $mainMod, Y, focuswindow, title:^Sunsama$
bind = $mainMod, T, focuswindow, class:^chrome-g3c\.corp\.google\.com

# Close the focused window
bind = $mainMod, Q, killactive,

# Move focus (vim keys).  Inside a tab group, h/l step through the tabs first.
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Move the focused window.  Moving into a tab group adds it as a tab; moving
# away from a group takes it out.  So $mainMod+Ctrl+k promotes a bottom window
# into the main window above it, and $mainMod+Ctrl+j sends it back down.
bind = $mainMod CTRL, H, movewindoworgroup, l
bind = $mainMod CTRL, J, movewindoworgroup, d
bind = $mainMod CTRL, K, movewindoworgroup, u
bind = $mainMod CTRL, L, movewindoworgroup, r

# Alt+Tab: jump back to the previous window.  Alt+Ctrl+Tab: cycle through all.
bind = ALT, Tab, focuscurrentorlast,
bind = ALT CTRL, Tab, cyclenext,

# Layout: add / remove a main window in the top row
bind = $mainMod, semicolon, layoutmsg, addmaster
bind = $mainMod, V, layoutmsg, removemaster

# Tabs: $mainMod+w turns the focused window into a tab group (or dissolves it);
# $mainMod+e pulls the focused tab out of its group.
bind = $mainMod, W, togglegroup,
bind = $mainMod, E, moveoutofgroup,

# Fullscreen; $mainMod+Ctrl+f maximizes instead (one window fills the screen).
bind = $mainMod, F, fullscreen, 0
bind = $mainMod CTRL, F, fullscreen, 1
bind = $mainMod CTRL, space, togglefloating,

# Resize.  The 120px side-to-side step divides a half-screen width (960 or
# 1920) into a power-of-two fraction, which keeps Hyprland 0.53's
# floating-point window widths exact.  With uneven steps (like 100px), a
# window touching the right screen edge could end up a fraction of a pixel
# short of it, so the cursor at the edge didn't reach it (fixed upstream in
# Hyprland 0.56).
binde = $mainMod CTRL, period, resizeactive, -120 0
binde = $mainMod CTRL, comma, resizeactive, 120 0
binde = $mainMod CTRL, M, resizeactive, 0 160
binde = $mainMod CTRL, slash, resizeactive, 0 -160

# Disable the mouse's back/forward buttons (bound buttons don't reach apps).
bind = , mouse:275, exec, true
bind = , mouse:276, exec, true

# Session: reload, exit, lock, lock + suspend
bind = $mainMod CTRL, C, exec, hyprctl reload
bind = $mainMod CTRL, E, exec, printf 'No\nYes - exit Hyprland\n' | fuzzel --dmenu --prompt 'Exit? ' | grep -q '^Yes' && hyprctl dispatch exit
bind = $mainMod CTRL, semicolon, exec, loginctl lock-session
bind = $mainMod, apostrophe, exec, systemctl suspend

# Notifications
bind = $mainMod, minus, exec, makoctl dismiss
bind = $mainMod CTRL, minus, exec, makoctl dismiss --all

# Display: invert colors (dark mode), night light, monitors
bind = $mainMod, comma, exec, $scripts/invert.sh
bind = $mainMod, M, exec, pkill -x gammastep; gammastep -O 2500
bind = $mainMod, N, exec, pkill -x gammastep
bind = $mainMod, period, exec, $scripts/monitors.sh external
bind = $mainMod, slash, exec, $scripts/monitors.sh all

# Screenshots to ~/Pictures/screenshots and the clipboard
bind = , Print, exec, $scripts/screenshot.sh
bind = $mainMod, C, exec, $scripts/screenshot.sh area

# Volume
bindel = $mainMod, up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mainMod, down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = $mainMod, bracketleft, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = $mainMod, bracketright, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Workspaces 1-5 have no key bindings (left hand), so keep Hyprland from ever
# choosing them.  It gives each monitor the lowest free workspace not bound to
# another monitor; binding 1-6 to a monitor that doesn't exist makes the first
# monitor start on 7.  $mainMod+6 still works ("none" never matches, so 6 opens
# on the current monitor).
workspace = 1, monitor:none
workspace = 2, monitor:none
workspace = 3, monitor:none
workspace = 4, monitor:none
workspace = 5, monitor:none
workspace = 6, monitor:none

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Don't let Google Chat or Zoom steal focus when they open (from i3).
windowrule {
    name = chat-no-focus
    match:class = chat\.google\.com
    no_initial_focus = true
    tile = yes
}

windowrule {
    name = zoom-no-focus
    match:title = ^(Zoom|.*zoom.*|.*join.*)$
    no_initial_focus = true
}
